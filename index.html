<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة طلاب علوم الحاسوب</title>
<style>
:root{box-sizing:border-box;color-scheme:light;--bg:transparent;--card:rgba(255,255,255,.58);--tx:#0c1f4a;--mut:#3c5688;--bd:rgba(12,31,74,.25);--pri:#3f72cf;--pt:#fff;--ok:#146c43;--okb:rgba(255,255,255,.75);--no:#b3261e;--nob:rgba(255,255,255,.8);--wr:#7a4f00;--wrb:rgba(255,248,225,.85)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#d7e5ff;color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
.scene{position:fixed;inset:0;z-index:0}
.scene svg{width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:22px 14px 40px}
.hero{text-align:center;margin:6px 0 22px;animation:rise .6s ease both}
h1{font-size:1.3rem;margin:4px 0 2px;color:#0c1f4a}
h2{font-size:1.1rem;margin:0 0 10px;color:#0c1f4a}
h2.ttl{text-align:center;font-size:1.25rem;letter-spacing:.5px;margin-bottom:6px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#1e4fb0;font-size:.88rem;min-height:1.5em}
.caret{display:inline-block;width:7px;height:1em;background:#1e4fb0;margin-inline-start:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.sub{color:var(--mut);margin:4px 0 12px;font-size:.9rem}
.card{background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:20px 18px;margin-bottom:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(10,21,48,.28);animation:rise .55s ease both}
label{display:block;font-size:.86rem;color:var(--mut);margin:14px 0 0}
input{width:100%;padding:8px 2px 8px;border:0;border-bottom:1.5px solid rgba(12,31,74,.55);border-radius:0;background:transparent;color:var(--tx);font:inherit;transition:.2s}
input:focus{outline:none;border-bottom-color:#3f72cf;box-shadow:0 2px 0 0 #3f72cf}
.btn{border:0;border-radius:6px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#6b9aee,#3f72cf);color:#fff;transition:transform .15s,box-shadow .25s}
.btn:hover{box-shadow:0 4px 16px rgba(63,114,207,.5)}.btn:active{transform:scale(.97)}
.btn.full{width:100%;margin-top:22px}
.btn.ok{background:#1f7a4d;color:#fff}.btn.no{background:#c0392b;color:#fff}
.btn.ghost{background:rgba(255,255,255,.6);color:#0c1f4a;border:1px solid rgba(12,31,74,.25)}
.swt{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:.88rem;color:var(--mut)}
.swt a{color:#0c1f4a;font-weight:700;cursor:pointer}
.note{padding:10px 12px;border-radius:8px;margin-top:12px;font-size:.92rem;animation:rise .4s ease both}
.note.err{background:var(--nob);color:var(--no)}.note.good{background:var(--okb);color:var(--ok)}.note.warn{background:var(--wrb);color:var(--wr)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;color:#0c1f4a}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row b{display:block}.row small{color:var(--mut)}
.acts{display:flex;gap:6px}.acts .btn{padding:8px 12px;font-size:.88rem}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:12px;padding:10px;text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stat b{font-size:1.3rem;display:block;color:#3f72cf}.stat span{font-size:.78rem;color:var(--mut)}
.inl{display:flex;gap:8px;align-items:end}.inl>div{flex:1}
.empty{color:var(--mut);text-align:center;padding:10px}
ul.warn{margin:8px 0 0;padding-inline-start:20px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body.home{background:#edf2fb}body.home .scene{display:none}
.home .wrap{max-width:1240px;padding:0 12px 60px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.home .card{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid #dbe5f6;border-radius:14px;box-shadow:0 1px 4px rgba(20,50,110,.07);padding:14px;animation:none}
.topbar{position:sticky;top:0;z-index:20;margin:0 -12px 14px;padding:8px 14px;background:#fff;box-shadow:0 1px 6px rgba(20,50,110,.12);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tb-start{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}
.search{display:flex;align-items:center;gap:6px;background:#eef3fb;border-radius:22px;padding:0 12px;flex:1;min-width:0;color:#5c6f94}
.search input{border:0;background:none;padding:9px 2px;color:#10244d;font:inherit;min-width:0;border-radius:0}
.search input:focus{box-shadow:none;border:0}
.tb-nav{display:flex;gap:4px;order:3;width:100%;justify-content:space-around;border-top:1px solid #e3eaf7;padding-top:4px}
.tb-nav a,.ib{color:#5c6f94;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.tb-nav a{flex:1;height:44px;border-bottom:3px solid transparent}
.tb-nav a.on{color:#2f6fe4;border-bottom-color:#2f6fe4}
.tb-end{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.ib{width:36px;height:36px;border-radius:50%;background:#eef3fb}
.dot{position:absolute;top:6px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:#e0457b}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.center{display:flex;flex-direction:column;gap:14px;order:1;min-width:0}
.rside{display:flex;flex-direction:column;gap:14px;order:2}
.side{order:3}
.me{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid #e3eaf7;margin-bottom:6px}
.sd-h{font-size:.72rem;letter-spacing:.5px;color:#7a8bb0;margin:12px 0 4px;font-weight:700}
.sd-i{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;color:#10244d;font-size:.92rem;cursor:pointer}
.sd-i:hover{background:#eef3fb}
.sd-ic{width:30px;height:30px;border-radius:8px;background:#e6efff;color:#2f6fe4;display:flex;align-items:center;justify-content:center;flex:none}
.more{display:block;margin:4px 0;padding:6px 10px;border:1px solid #dbe5f6;border-radius:8px;text-align:center;font-size:.82rem;color:#5c6f94;cursor:pointer}
.stories{display:flex;gap:10px;overflow-x:auto;padding:12px}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:72px}
.story small{font-size:.76rem;color:#10244d}
.s-img{position:relative;border-radius:50%;padding:3px}
.s-img.ring{background:linear-gradient(135deg,#2f6fe4,#22c1c3)}
.s-img.ring .av{border:3px solid #fff}
.s-plus{position:absolute;bottom:0;inset-inline-end:0;width:22px;height:22px;border-radius:50%;background:#2f6fe4;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.pb-top{display:flex;gap:10px;align-items:center}
.pb-in{flex:1;background:#eef3fb;border-radius:22px;padding:10px 14px;color:#5c6f94;font-size:.92rem}
.pb-acts{display:flex;gap:6px;margin-top:10px;border-top:1px solid #e3eaf7;padding-top:10px;flex-wrap:wrap}
.pa{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:.84rem;cursor:pointer}
.c1{background:#ffe9ef;color:#c2325f}.c2{background:#e5f0ff;color:#2f6fe4}.c3{background:#e2f7ee;color:#0b7a5c}.c4{background:#fff1de;color:#b85f0a}
.feed-tabs{display:flex;gap:16px;font-size:.82rem;font-weight:700;color:#7a8bb0;padding:0 4px}
.feed-tabs a{padding-bottom:4px;cursor:pointer}.feed-tabs a.on{color:#2f6fe4;border-bottom:2px solid #2f6fe4}
.fd-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fd-h b{display:block}.fd-h small{color:#7a8bb0}
.feed p{margin:6px 0 10px;color:#10244d}
.fd-f{display:flex;justify-content:space-around;border-top:1px solid #e3eaf7;margin-top:10px;padding-top:8px}
.fd-f a{display:flex;align-items:center;gap:6px;color:#5c6f94;font-size:.88rem;cursor:pointer}
.rs-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#10244d}
.rs-h a{font-size:.78rem;color:#2f6fe4;cursor:pointer}
.ev-ban{height:84px;border-radius:10px;background:linear-gradient(135deg,#2f6fe4,#22c1c3);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px}
.ev-row{display:flex;gap:10px;align-items:center}.ev-row small{display:block;color:#7a8bb0}
.ev-d{background:#e6efff;border-radius:10px;padding:4px 10px;text-align:center;color:#2f6fe4;flex:none}.ev-d small{color:#2f6fe4}.ev-d b{display:block;font-size:1.2rem}
.fr{display:flex;gap:10px}.fr small{display:block;color:#7a8bb0}
.fr-b{display:flex;gap:6px;margin-top:6px}.fr-b .btn{padding:6px 14px;font-size:.82rem}
.grp{display:flex;align-items:center;gap:10px}.grp div{flex:1}.grp small{display:block;color:#7a8bb0}.grp .btn{padding:6px 14px;font-size:.82rem}
.ct{display:flex;align-items:center;gap:10px;padding:6px 0}.ct small{display:block;font-size:.76rem}
.ct small.on{color:#0b7a5c}.ct small.off{color:#9aa8c4}
.home .btn{background:#2f6fe4;border-radius:8px}.home .btn.ghost{background:#fff;color:#2f6fe4;border:1px solid #cfdcf3}
@media (min-width:980px){
  .topbar{flex-wrap:nowrap;padding:8px 20px}
  .tb-start{flex:0 0 320px}
  .tb-nav{order:0;width:auto;flex:1;justify-content:center;border:0;padding:0;max-width:460px;margin:0 auto}
  .home-grid{grid-template-columns:260px minmax(0,1fr) 310px;align-items:start}
  .side{order:0;position:sticky;top:76px}.center{order:0}.rside{order:0}
}
</style>

function rWait(){
  const st=me.status;

}

  <button class="btn full" data-act="agree">أوافق وأتعهد بالالتزام</button><button class="btn ghost full" data-act="out">خروج</button></div>`;
}

function rAdmin(){
  const pend=students.filter(s=>s.status==="pending").sort((a,b)=>a.at-b.at);
  const appr=students.filter(s=>s.status==="approved"),rej=students.filter(s=>s.status==="rejected"),cap=cfg.capacity;
  const rows=(l,b)=>l.length?l.map(s=>`<div class="row"><div><b>${esc(s.name)}</b><small>الرقم: ${esc(s.num)}</small></div><div class="acts">${b(s)}</div></div>`).join(""):'<div class="empty">لا يوجد</div>';
  const ok=s=>`<button class="btn ok" data-act="approve" data-id="${esc(s.id)}">موافقة</button>`;
  const del=s=>`<button class="btn ghost" data-act="del" data-id="${esc(s.id)}">حذف</button>`;
  const no=(s,t)=>`<button class="btn no" data-act="reject" data-id="${esc(s.id)}">${t}</button>`;
  app.innerHTML=`<div class="bar"><h2 style="margin:0">🛡️ لوحة المسؤول (${esc(me.name)})</h2><button class="btn ghost" data-act="out">خروج</button></div>
  <div class="stats"><div class="stat"><b>${pend.length}</b><span>بانتظار القرار</span></div><div class="stat"><b>${appr.length} / ${cap}</b><span>المقبولون / السعة</span></div><div class="stat"><b>${rej.length}</b><span>المرفوضون</span></div></div>${noteHtml()}
  <div class="card"><h2>📨 طلبات التسجيل</h2>${rows(pend,s=>ok(s)+no(s,"منع"))}</div>
  <div class="card"><h2>✅ المقبولون</h2>${rows(appr,s=>no(s,"إيقاف"))}</div>
  <div class="card"><h2>🚫 المرفوضون</h2>${rows(rej,s=>ok(s)+del(s))}${rej.length?'<button class="btn no full" data-act="delall">حذف كل المرفوضين ('+rej.length+')</button>':""}</div>
  <div class="card"><h2>👥 عدد المقبولين الأقصى</h2><div class="inl"><div><input id="cap" type="number" min="1" value="${cap}"></div><button class="btn" data-act="cap">حفظ</button></div></div>`
  +(me.main?`<div class="card"><h2>➕ إضافة مسؤول جديد</h2><p class="sub">هذا الحق خاص بالمسؤول الرئيسي فقط. كلمة السر 6 أحرف على الأقل.</p><label>اسم المستخدم</label><input id="an" autocomplete="off"><label>كلمة السر</label><input id="ap" type="password" autocomplete="off"><button class="btn full" data-act="addadmin">إضافة</button><div style="margin-top:12px"><b>المسؤولون:</b> ${MAIN_USER} (رئيسي)${admins.map(a=>"، "+esc(a.u)).join("")}</div></div>`:"");
}

function startAdminSubs(){
  clearSubs();
  const err=e=>{setNote("خطأ في القراءة: "+e.code);render()};
  unsubs.push(onSnapshot(collection(db,"students"),s=>{students=s.docs.map(d=>({...d.data(),id:d.id}));if(view==="admin")render()},err));
  unsubs.push(onSnapshot(doc(db,"config","main"),s=>{if(s.exists()&&s.data().capacity)cfg=s.data();if(view==="admin")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"admins"),s=>{admins=s.docs.map(d=>d.data());if(view==="admin")render()},()=>{}));
}
function watchStudent(id){
  clearSubs();
  unsubs.push(onSnapshot(doc(db,"students",id),s=>{if(s.exists()){me.status=s.data().status;if(view==="wait")rWait()}},()=>{}));
}
async function adminLogin(user,pw){
  const cr=await signInWithEmailAndPassword(auth,user+DOMAIN,pw);
  const main=user===MAIN_USER;
  if(!main){try{const d=await getDoc(doc(db,"admins",cr.user.uid));if(!d.exists())throw 0}catch(e){await signOut(auth);throw new Error("not-admin")}}
  me={name:user,main};view="admin";startAdminSubs();render();
}

app.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]");if(!el||busy)return;
  const a=el.dataset.act,f1=document.getElementById("f1"),f2=document.getElementById("f2");
  setNote(null);busy=true;
  try{
    if(a==="tab"){tab=el.dataset.v;render()}
    else if(a==="out"){clearSubs();await signOut(auth);me=null;view="auth";tab="login";render()}
    else if(a==="agree"){view="home";render()}
    else if(a==="reg"){
      const n=f1.value.trim(),num=f2.value.trim();
      if(!n||!num){setNote("أدخل الاسم والرقم.");return render()}
      if(!/^[A-Za-z0-9_.-]+$/.test(num)){setNote("الرقم يجب أن يحتوي أرقاماً أو حروفاً إنجليزية فقط.");return render()}
      const ex=await getDoc(doc(db,"students",num));
      if(ex.exists()){const st=ex.data().status;setNote(st==="approved"?"هذا الرقم مقبول مسبقاً، سجّل الدخول.":st==="rejected"?"تم رفض هذا الرقم سابقاً.":"طلبك مرسل مسبقاً وبانتظار المسؤول.","warn");return render()}
      await setDoc(doc(db,"students",num),{name:n,num,status:"pending",at:Date.now()});
      me={name:n,num,status:"pending"};view="wait";watchStudent(num);render();
    }
    else if(a==="login"){
      const n=f1.value.trim(),pw=f2.value.trim();
      if(!n||!pw){setNote("أدخل الاسم والرقم.");return render()}
      let s=null;
      if(/^[A-Za-z0-9_.-]+$/.test(pw)){const d=await getDoc(doc(db,"students",pw));if(d.exists()&&d.data().name.trim().toLowerCase()===n.toLowerCase())s=d.data()}
      if(s){me={name:s.name,num:s.num,status:s.status};
        if(s.status==="approved"){view="welcome"}else{view="wait";watchStudent(s.num)}
        return render()}
      try{await adminLogin(n.toLowerCase(),pw)}catch(e){setNote("الاسم أو الرقم غير صحيح، أو لم تسجّل بعد.");render()}
    }
    else if(a==="approve"){
      if(count("approved")>=cfg.capacity){setNote(`وصلت للحد الأقصى (${cfg.capacity}). ارفع العدد الأقصى أولاً.`);return render()}
      await updateDoc(doc(db,"students",el.dataset.id),{status:"approved"});
    }
    else if(a==="reject"){await updateDoc(doc(db,"students",el.dataset.id),{status:"rejected"})}
    else if(a==="del"){if(confirm("حذف هذا الطلب نهائياً؟"))await deleteDoc(doc(db,"students",el.dataset.id))}
    else if(a==="delall"){const list=students.filter(x=>x.status==="rejected");if(confirm("حذف كل المرفوضين ("+list.length+") نهائياً؟")){for(const x of list)await deleteDoc(doc(db,"students",x.id));setNote("تم حذف المرفوضين","good");render()}}
    else if(a==="cap"){
      const v=parseInt(document.getElementById("cap").value,10);
      if(!(v>=1)){setNote("أدخل رقماً صحيحاً.");return render()}
      await setDoc(doc(db,"config","main"),{capacity:v});setNote("تم تحديث العدد الأقصى إلى "+v,"good");render();
    }
    else if(a==="addadmin"){
      if(!me.main)return;
      const u=document.getElementById("an").value.trim().toLowerCase(),p=document.getElementById("ap").value.trim();
      if(!/^[a-z0-9_.-]+$/.test(u)||p.length<6){setNote("اسم بحروف إنجليزية/أرقام، وكلمة سر 6 أحرف على الأقل.");return render()}
      if(u===MAIN_USER){setNote("هذا الاسم محجوز.");return render()}
      const second=initializeApp(firebaseConfig,"second"+Date.now());
      const a2=getAuth(second);
      const cr=await createUserWithEmailAndPassword(a2,u+DOMAIN,p);
      await signOut(a2);
      await setDoc(doc(db,"admins",cr.user.uid),{u,uid:cr.user.uid});
      setNote("تمت إضافة المسؤول "+u,"good");render();
    }
  }catch(e){setNote("حدث خطأ: "+(e.code||e.message||"غير معروف"));render()}
  finally{busy=false}
});
render();

/* ===== سطر الكتابة المتحركة ===== */
(function(){
  const ph=['> while(alive){ learn(); }','> git commit -m "new idea"','> print("Hello, CS!")','> sudo make me_a_dev'];
  let pi=0,ci=0,del=false,hold=0;
  setInterval(()=>{
    const el=document.getElementById("typed");if(!el)return;
    const p=ph[pi];
    if(!del){ci++;if(ci>=p.length){ci=p.length;del=true;hold=22}}
    else if(hold>0){hold--}
    else{ci--;if(ci<=0){ci=0;del=false;pi=(pi+1)%ph.length}}
    el.textContent=p.slice(0,ci);
  },90);
})();
</script>
