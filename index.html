<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة طلاب علوم الحاسوب — كلية الإمام الهادي</title>
<style>
:root{
  box-sizing:border-box;
  color-scheme:light;
  --page:#eef3fa;
  --surface:#ffffff;
  --soft:#f6f9fd;
  --ink:#0d2240;
  --muted:#566c8d;
  --line:#dce5f2;
  --blue:#1d6fd8;
  --blue-dark:#1557b0;
  --blue-soft:#e8f1fd;
  --navy:#0f3968;
  --accent:#0ea5e9;
  --ok:#157347;
  --ok-bg:#e8f6ef;
  --no:#b42318;
  --no-bg:#fef3f2;
  --wr:#854d0e;
  --wr-bg:#fef9c3;
  --shadow:0 4px 16px rgba(13,34,64,.05);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(circle at top right, #e3eefc 0%, var(--page) 48%, #e8eef7 100%);
  color:var(--ink);
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

.topnav{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(13,34,64,.04);
}
.topnav-in{
  max-width:1280px;
  margin:0 auto;
  padding:9px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-badge{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--surface);
  border:1.5px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.logo-badge img{width:100%;height:100%;object-fit:contain;padding:2px}
.brand-title{
  font-weight:800;
  font-size:.98rem;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-sub{font-size:.75rem;color:var(--muted)}
.search-wrap{flex:1;max-width:310px;min-width:120px}
.search-wrap input{
  width:100%;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  border-radius:999px;
  padding:8px 14px;
  font:inherit;
  font-size:.88rem;
}
.search-wrap input:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}

.profile-menu-wrap{position:relative}
.avatar-trigger{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:var(--blue-soft);
  color:var(--blue);
  font-weight:800;
  font-size:.95rem;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:.15s ease;
}
.avatar-trigger:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

.profile-dropdown{
  position:absolute;
  top:calc(100% + 8px);
  inset-inline-start:0;
  width:255px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 12px 28px rgba(13,34,64,.14);
  padding:10px;
  z-index:60;
  display:none;
}
.profile-dropdown.open{display:block}
.profile-card-box{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}
.profile-card-name{font-weight:800;font-size:.92rem;color:var(--ink)}
.profile-card-meta{font-size:.78rem;color:var(--muted);margin-top:2px}
.menu-item-btn{
  width:100%;
  border:0;
  background:transparent;
  color:var(--ink);
  font:inherit;
  font-size:.86rem;
  font-weight:700;
  padding:9px 10px;
  border-radius:9px;
  text-align:right;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:3px;
}
.menu-item-btn:hover{background:var(--blue-soft);color:var(--blue)}
.menu-item-btn.active{background:var(--blue-soft);color:var(--blue)}
.menu-item-btn.danger{color:var(--no)}
.menu-item-btn.danger:hover{background:var(--no-bg);color:var(--no)}

.auth-wrap{max-width:520px;margin:28px auto;padding:0 14px 40px}
.dash-wrap{max-width:1280px;margin:16px auto;padding:0 14px 44px}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
  margin-top:14px;
}
.choice-card{
  background:var(--soft);
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:18px 16px;
  text-align:center;
  cursor:pointer;
  transition:.18s ease;
}
.choice-card:hover{
  border-color:var(--blue);
  background:var(--blue-soft);
  transform:translateY(-2px);
}
.choice-icon{font-size:1.85rem;margin-bottom:6px}
.choice-title{font-weight:800;font-size:1.02rem;color:var(--ink);margin-bottom:4px}
.choice-desc{font-size:.84rem;color:var(--muted)}

.home-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:16px;
  align-items:start;
}
.left-rail{order:2}
.main-feed{order:1}
@media (max-width:920px){
  .home-layout{grid-template-columns:1fr}
  .left-rail{order:1}
  .main-feed{order:2}
}
@media (max-width:760px){.search-wrap{display:none}}

.admin-layout{
  display:grid;
  grid-template-columns:270px minmax(0,1fr) 290px;
  gap:16px;
  align-items:start;
}
@media (max-width:1024px){.admin-layout{grid-template-columns:1fr}}

/* واجهة المنصة الدراسية بأسلوب Harmash */
.course-tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:14px;
  border-bottom:1px solid var(--line);
}
.course-tab{
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  border-radius:8px;
  padding:8px 13px;
  font:inherit;
  font-size:.84rem;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}
.course-tab.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}
.course-nav-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:14px 0;
  flex-wrap:wrap;
}
.course-btn-navy{
  background:var(--navy);
  color:#fff;
  border:0;
  border-radius:8px;
  padding:9px 16px;
  font:inherit;
  font-weight:700;
  font-size:.88rem;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.course-btn-navy:hover:not(:disabled){opacity:.92}
.course-btn-navy:disabled{opacity:.45;cursor:not-allowed}
.lesson-panel{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin-top:10px;
}
.lesson-list-box{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-top:12px;
}
.lesson-link-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  font-size:.9rem;
  font-weight:600;
  color:var(--ink);
  border-radius:8px;
}
.lesson-link-item:last-child{border-bottom:0}
.lesson-link-item:hover{background:var(--blue-soft);color:var(--blue)}
.lesson-link-item.active{background:var(--blue-soft);color:var(--blue);font-weight:800}

.box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.hero-auth{text-align:center;margin-bottom:16px}
.hero-auth .big-logo{
  width:84px;
  height:84px;
  margin:0 auto 8px;
  border-radius:22px;
  background:var(--surface);
  border:1.5px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.hero-auth .big-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
h1{margin:0;font-size:1.32rem;color:var(--ink)}
h2{margin:0 0 10px;font-size:1.06rem;color:var(--ink)}
h2.center{text-align:center;font-size:1.2rem;margin-bottom:8px}
.muted{color:var(--muted);font-size:.88rem;margin:4px 0 10px}
.code-line{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  color:var(--blue);
  font-size:.85rem;
  min-height:1.4em;
}
.caret{
  display:inline-block;
  width:7px;
  height:1em;
  background:var(--blue);
  margin-inline-start:2px;
  vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}

label{display:block;font-size:.84rem;color:var(--muted);margin:12px 0 4px;font-weight:700}
input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  border-radius:10px;
  padding:9px 11px;
  font:inherit;
  font-size:.92rem;
}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-inline-end:38px}
.eye-btn{position:absolute;inset-inline-end:6px;background:transparent;border:0;cursor:pointer;font-size:1rem;padding:4px}
.btn{
  border:0;
  border-radius:10px;
  padding:9px 14px;
  font:inherit;
  font-weight:700;
  font-size:.89rem;
  cursor:pointer;
  background:var(--blue);
  color:#fff;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover:not(:disabled){background:var(--blue-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%;margin-top:14px}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:var(--no);color:#fff}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
}
.avatar-circle{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--blue-soft);
  color:var(--blue);
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.rail-sec-title{
  font-size:.74rem;
  font-weight:800;
  letter-spacing:.4px;
  color:var(--muted);
  margin:12px 0 6px;
  text-transform:uppercase;
}
.rail-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px;
  border-radius:10px;
  color:var(--ink);
  text-decoration:none;
  font-size:.88rem;
  font-weight:600;
  margin-bottom:4px;
  background:transparent;
  cursor:pointer;
}
.rail-item:hover, .rail-item.active{background:var(--blue-soft);color:var(--blue)}
.see-more-btn{
  width:100%;
  margin-top:6px;
  padding:7px 10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  font:inherit;
  font-size:.84rem;
  font-weight:700;
  cursor:pointer;
}
.see-more-btn:hover{background:var(--blue-soft);color:var(--blue)}
.pill{
  background:var(--blue-soft);
  color:var(--blue);
  font-size:.74rem;
  padding:2px 8px;
  border-radius:999px;
  font-weight:700;
}

.feed-card{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
.feed-card:last-child{margin-bottom:0}
.feed-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
}
.feed-title{font-weight:700;color:var(--ink)}
.feed-meta{font-size:.78rem;color:var(--muted)}

.replies-box{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}
.reply-item{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  margin-bottom:6px;
  font-size:.86rem;
}
.reply-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:2px;
}
.reply-form{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.reply-form input{
  flex:1;
  padding:7px 11px;
  font-size:.86rem;
  background:var(--surface);
}
.reply-form .btn{
  padding:7px 12px;
  font-size:.84rem;
  white-space:nowrap;
}

.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:10px;
}
.mini-stat{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px;
  text-align:center;
}
.mini-stat b{display:block;font-size:1.15rem;color:var(--blue)}
.mini-stat span{font-size:.75rem;color:var(--muted)}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-top:1px solid var(--line);
  flex-wrap:wrap;
}
.row:first-child{border-top:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:6px 11px;font-size:.84rem}
.inl{display:flex;gap:8px;align-items:end}
.inl>div{flex:1}
.empty{text-align:center;color:var(--muted);padding:12px;font-size:.88rem}

.note{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:.88rem;font-weight:600}
.note.err{background:var(--no-bg);color:var(--no)}
.note.good{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--wr-bg);color:var(--wr)}
ul.warn{margin:6px 0 0;padding-inline-start:20px;font-weight:400}
.swt{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.swt a{color:var(--blue);font-weight:700;cursor:pointer}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPyYR--LMGnRWDk5ZfTv81pDqYgPVQnUw",
  authDomain: "mywep-65144.firebaseapp.com",
  projectId: "mywep-65144",
  storageBucket: "mywep-65144.firebasestorage.app",
  messagingSenderId: "534570832709",
  appId: "1:534570832709:web:90784f0c546d2a1f6de42c"
};

const MAIN_USER = "abdo";
const ADMIN_DOMAIN = "@platform.local";
const STUDENT_DOMAIN = "@students.platform.local";
const LAST_ID_KEY = "cs_platform_last_id";
const LOGO_SRC = "./logo.png";
const MAX_COURSE_SUBJECTS = 7;

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp), db = getFirestore(fbApp);

let students=[],admins=[],announcements=[],resources=[],messages=[],groups=[],groupPosts=[],groupReplies=[],courseSubjects=[],courseLessons=[],cfg={capacity:15},me=null,view="auth",tab="login",studentPage="posts",note=null,unsubs=[],busy=false,searchQ="";
let activeSubjectId="", activeLessonIdx=0;
let selectedGroupId="all";
let showAllRes=false,showAllAnn=false,showAllGrp=false;
let profileMenuOpen=false;
let failCount=0,lockUntil=0;
const app=document.getElementById("app");
const esc=s=>{const d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML};
const fmtDate=t=>t?new Date(t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"}):"";
const setNote=(t,k)=>{note=t?{t,k:k||"err"}:null};
const noteHtml=()=>note?`<div class="note ${note.k}">${esc(note.t)}</div>`:"";
const count=st=>students.filter(s=>s.status===st).length;
const clearSubs=()=>{unsubs.forEach(u=>u());unsubs=[]};
const savedId=()=>{try{return localStorage.getItem(LAST_ID_KEY)||""}catch(_e){return ""}};
const saveId=v=>{try{if(v)localStorage.setItem(LAST_ID_KEY,v);else localStorage.removeItem(LAST_ID_KEY)}catch(_e){}};
const pwField=(id,label,ph="")=>`<label>${label}</label><div class="pw-wrap"><input id="${id}" type="password" placeholder="${esc(ph)}" autocomplete="off"><button type="button" class="eye-btn" data-eye="${id}" aria-label="إظهار كلمة السر">👁️</button></div>`;
const isLocked=()=>Date.now()<lockUntil;
const logoImg=(alt="شعار كلية الإمام الهادي")=>`<img src="${LOGO_SRC}" alt="${esc(alt)}" onerror="this.outerHTML='<span>🎓</span>'">`;

setInterval(()=>{
  if(view==="auth" && tab==="login" && lockUntil>0){
    const btn=document.getElementById("loginBtn");
    const rem=Math.ceil((lockUntil-Date.now())/1000);
    if(rem>0 && btn){btn.disabled=true;btn.textContent=`انتظر ${rem} ثانية…`}
    else if(rem<=0){lockUntil=0;failCount=0;if(btn){btn.disabled=false;btn.textContent="دخول"}}
  }
},1000);

function friendlyAuthError(e){
  const c=e?.code||"";
  if(c==="auth/invalid-credential"||c==="auth/user-not-found"||c==="auth/wrong-password")return "الرقم الجامعي أو اسم المسؤول أو كلمة السر غير صحيحة.";
  if(c==="auth/email-already-in-use")return "هذا الرقم الجامعي مسجل مسبقاً، جرّب تسجيل الدخول.";
  if(c==="auth/weak-password")return "كلمة السر ضعيفة، يجب أن تكون 6 أحرف على الأقل.";
  if(c==="auth/network-request-failed")return "تعذّر الاتصال بالإنترنت، تحقّق من شبكتك.";
  if(c==="auth/too-many-requests")return "تم إرسال طلبات كثيرة مؤقتاً، انتظر قليلاً ثم أعد المحاولة.";
  return e?.message||c||"حدث خطأ غير متوقع.";
}

function render(){
  const isWide = (view==="home"||view==="admin");
  app.className = isWide ? "dash-wrap" : "auth-wrap";
  ({auth:rAuth,welcome:rWelcome,choose:rChoose,admin:rAdmin,home:rHome,wait:rWait})[view]();
}

function authHero(){
  return `<div class="hero-auth">
    <div class="big-logo">${logoImg()}</div>
    <h1>منصة طلاب علوم الحاسوب</h1>
    <div class="code-line" dir="ltr"><span id="typed"></span><i class="caret"></i></div>
    <p class="muted">كلية الإمام الهادي — مساحة لزملاء التخصص</p>
  </div>`;
}

function topNav(title, showStudentNav=false, hideStudentIdentity=false){
  const initial = (!hideStudentIdentity && me?.name)
    ? me.name.trim().charAt(0).toUpperCase()
    : (showStudentNav ? "☰" : "⚙️");

  const studentIdentityBox = (showStudentNav && !hideStudentIdentity && me) ? `
    <div class="profile-card-box">
      <div class="profile-card-name">${esc(me.name)}</div>
      <div class="profile-card-meta">الرقم الجامعي: ${esc(me.num || "-")}</div>
      <div class="profile-card-meta">المستوى: ${esc(me.level || "طالب")}</div>
    </div>
  ` : "";

  const studentNavItems = showStudentNav ? `
    <button type="button" class="menu-item-btn ${studentPage==="posts"?"active":""}" data-act="go_posts">
      <span>💬 مكان المنشورات</span>
    </button>
    <button type="button" class="menu-item-btn ${studentPage==="subjects"?"active":""}" data-act="go_subjects">
      <span>📚 المنصة الدراسية</span>
    </button>
    <button type="button" class="menu-item-btn" data-act="go_choose">
      <span>🧭 تغيير الوجهة</span>
    </button>
  ` : "";

  return `<header class="topnav">
    <div class="topnav-in">
      <div class="brand">
        <div class="logo-badge">${logoImg()}</div>
        <div>
          <div class="brand-title">${hideStudentIdentity ? "المنصة الدراسية" : esc(title)}</div>
          <div class="brand-sub">كلية الإمام الهادي • علوم الحاسوب</div>

function rSubjectsPage(){
  if(!courseSubjects.length){
    return `<section class="box">
      <div class="course-nav-bar">
        <button class="course-btn-navy" data-act="go_posts">‹ الرئيسية</button>
      </div>
      <div class="empty" style="padding:28px 12px">
        المواد الدراسية فارغة حالياً — سيقوم المسؤول بإضافتها وتجهيز دروسها قريباً.
      </div>
    </section>`;
  }

  const q=searchQ.trim().toLowerCase();
  const subj = courseSubjects.find(s => s.id === activeSubjectId) || courseSubjects[0];
  const subjLessonsAll = courseLessons.filter(l => l.subjectId === subj.id);
  const lessons = q
    ? subjLessonsAll.filter(l => `${l.title||""} ${l.body||""}`.toLowerCase().includes(q))
    : subjLessonsAll;

  const safeIdx = lessons.length ? Math.min(activeLessonIdx, lessons.length - 1) : 0;
  const currentLesson = lessons[safeIdx] || null;

  const tabsHtml = courseSubjects.map(s =>
    `<button class="course-tab ${s.id === subj.id ? "active" : ""}" data-act="pick_subj" data-id="${esc(s.id)}">${esc(s.tabName || s.title)}</button>`
  ).join("");

  const listHtml = lessons.length
    ? lessons.map((l, idx) =>
        `<div class="lesson-link-item ${idx === safeIdx ? "active" : ""}" data-act="pick_lesson" data-idx="${idx}">
          <span>${esc(l.title)}</span>
          <span>‹</span>
        </div>`
      ).join("")
    : `<div class="empty">لا توجد دروس مضافة لهذه المادة بعد.</div>`;

  return `<section class="box">
    <div class="course-tabs">${tabsHtml}</div>

    <div class="course-nav-bar">
      <button class="course-btn-navy" data-act="go_posts">‹ الرئيسية</button>
      <button class="course-btn-navy" data-act="next_lesson" ${safeIdx >= lessons.length - 1 ? "disabled" : ""}>الدرس التالي ‹</button>
    </div>

    <h2 style="margin:12px 0 6px;font-size:1.3rem">${esc(subj.title)}</h2>
    ${subj.url ? `<div style="margin-bottom:10px"><a class="btn soft" href="${esc(subj.url)}" target="_blank" rel="noopener">فتح رابط المادة</a></div>` : ""}

    <div class="lesson-panel">
      ${currentLesson ? `
        <div class="feed-meta" style="margin-bottom:4px">الدرس ${safeIdx + 1} من ${lessons.length}</div>
        <h3 style="margin:0 0 8px;font-size:1.05rem;color:var(--ink)">${esc(currentLesson.title)}</h3>
        <div style="white-space:pre-line;font-size:.94rem;color:var(--ink)">${esc(currentLesson.body||"")}</div>
        ${currentLesson.url ? `<div style="margin-top:12px"><a class="btn soft" href="${esc(currentLesson.url)}" target="_blank" rel="noopener">فتح الملف / المصدر</a></div>` : ""}
      ` : `<div class="empty">لم تتم إضافة دروس لهذه المادة بعد.</div>`}
    </div>

    <div class="lesson-list-box">
      ${listHtml}
    </div>
  </section>`;
}

function startStudentSubs(){
  clearSubs();
  if(me?.uid){
    unsubs.push(onSnapshot(doc(db,"students",me.uid),async s=>{
      if(!s.exists() || s.data().status!=="approved"){
        clearSubs();
        await signOut(auth).catch(()=>{});
        me=null;studentPage="posts";profileMenuOpen=false;view="auth";tab="login";
        setNote("تم إيقاف أو إنهاء صلاحية الجلسة، يرجى مراجعة الإدارة.","err");
        render();
      }
    },()=>{}));
  }
  unsubs.push(onSnapshot(collection(db,"announcements"),s=>{announcements=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"resources"),s=>{resources=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"groups"),s=>{groups=s.docs.map(d=>({...d.data(),id:d.id}));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"group_posts"),s=>{groupPosts=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"group_replies"),s=>{groupReplies=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.at||0)-(b.at||0));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"course_subjects"),s=>{
    courseSubjects=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.at||0)-(b.at||0));
    if(!courseSubjects.some(x=>x.id===activeSubjectId)){
      activeSubjectId=courseSubjects.length?courseSubjects[0].id:"";
      activeLessonIdx=0;
    }
    if(view==="home")render();
  },()=>{}));
  unsubs.push(onSnapshot(collection(db,"course_lessons"),s=>{courseLessons=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.at||0)-(b.at||0));if(view==="home")render()},()=>{}));
}

function watchStudent(uid){
  clearSubs();

async function adminLogin(user,pw){
  const cr=await signInWithEmailAndPassword(auth,user+ADMIN_DOMAIN,pw);
  const main=user===MAIN_USER;
  if(!main){try{const d=await getDoc(doc(db,"admins",cr.user.uid));if(!d.exists())throw 0}catch(e){await signOut(auth);throw new Error("not-admin")}}
  me={name:user,main};view="admin";startAdminSubs();render();
}

app.addEventListener("click",async ev=>{
  const eye=ev.target.closest("[data-eye]");
  if(eye){
    const inp=document.getElementById(eye.dataset.eye);
    if(inp){inp.type=inp.type==="password"?"text":"password";eye.textContent=inp.type==="password"?"👁️":"🙈"}
    return;
  }
  const el=ev.target.closest("[data-act]");if(!el||busy)return;
  const a=el.dataset.act;
  if(a==="toggle_menu"){profileMenuOpen=!profileMenuOpen;render();return}
  profileMenuOpen=false;

  const f1=document.getElementById("f1"),f2=document.getElementById("f2"),f3=document.getElementById("f3"),f4=document.getElementById("f4"),f5=document.getElementById("f5");
  setNote(null);busy=true;
  try{
    if(a==="go_choose"){view="choose";render()}
    else if(a==="go_posts"){studentPage="posts";view="home";startStudentSubs();render()}
    else if(a==="go_subjects"){studentPage="subjects";activeLessonIdx=0;view="home";startStudentSubs();render()}
    else if(a==="pick_subj"){activeSubjectId=el.dataset.id;activeLessonIdx=0;render()}
    else if(a==="pick_lesson"){activeLessonIdx=parseInt(el.dataset.idx,10)||0;render()}
    else if(a==="next_lesson"){activeLessonIdx=(activeLessonIdx||0)+1;render()}
    else if(a==="addsubj"){
      if(courseSubjects.length>=MAX_COURSE_SUBJECTS){setNote(`الحد الأقصى هو ${MAX_COURSE_SUBJECTS} مواد.`,"warn");return render()}
      const tabName=document.getElementById("csTab").value.trim();
      const title=document.getElementById("csTitle").value.trim();
      const url=document.getElementById("csUrl").value.trim();
      if(!title){setNote("أدخل عنوان المادة.");return render()}
      await addDoc(collection(db,"course_subjects"),{tabName:tabName||title,title,url,at:Date.now()});
      setNote("تم إنشاء المادة بنجاح.","good");render();
    }
    else if(a==="delsubj"){
      if(confirm("حذف هذه المادة وكل دروسها؟")){
        const subId=el.dataset.id;
        const relatedLessons=courseLessons.filter(l=>l.subjectId===subId);
        for(const l of relatedLessons) await deleteDoc(doc(db,"course_lessons",l.id));
        await deleteDoc(doc(db,"course_subjects",subId));
        setNote("تم حذف المادة.","good");render();
      }
    }
    else if(a==="addlesson"){
      const subjectId=document.getElementById("clSubj").value;
      const title=document.getElementById("clTitle").value.trim();
      const body=document.getElementById("clBody").value.trim();
      const url=document.getElementById("clUrl").value.trim();
      if(!subjectId){setNote("أنشئ مادة أولاً قبل إضافة درس.");return render()}
      if(!title){setNote("أدخل عنوان الدرس.");return render()}
      await addDoc(collection(db,"course_lessons"),{subjectId,title,body,url,at:Date.now()});
      setNote("تمت إضافة الدرس بنجاح.","good");render();
    }
    else if(a==="dellesson"){
      await deleteDoc(doc(db,"course_lessons",el.dataset.id));
      setNote("تم حذف الدرس.","good");render();
    }
    else if(a==="selectgrp"){studentPage="posts";selectedGroupId=el.dataset.id;view="home";startStudentSubs();render()}
    else if(a==="togres"){showAllRes=!showAllRes;render()}
    else if(a==="togann"){showAllAnn=!showAllAnn;render()}
    else if(a==="toggrp"){showAllGrp=!showAllGrp;render()}
    else if(a==="tab"){tab=el.dataset.v;render()}
    else if(a==="clearid"){saveId("");render()}
    else if(a==="out"){clearSubs();await signOut(auth);me=null;studentPage="posts";view="auth";tab="login";render()}
    else if(a==="agree"){
      if(me?.uid){
        await updateDoc(doc(db,"students",me.uid),{acceptedRules:true,acceptedAt:Date.now()});
        me.acceptedRules=true;
      }
      view="choose";render();
    }
    else if(a==="reg"){
      const n=f1.value.trim(),num=f2.value.trim(),lvl=f3.value,pw=f4.value.trim(),pw2=f5.value.trim();
      if(!n||!num||!pw||!pw2){setNote("أدخل الاسم والرقم الجامعي وكلمة السر وتأكيدها.");return render()}
      if(!/^[A-Za-z0-9_.-]+$/.test(num)){setNote("الرقم يجب أن يحتوي أرقاماً أو حروفاً إنجليزية فقط.");return render()}
      if(pw.length<6){setNote("كلمة السر يجب أن تكون 6 أحرف على الأقل.");return render()}
      if(pw!==pw2){setNote("كلمتا السر غير متطابقتين.");return render()}
      const cr=await createUserWithEmailAndPassword(auth,num+STUDENT_DOMAIN,pw);
      const data={uid:cr.user.uid,name:n,num,level:lvl,status:"pending",acceptedRules:false,at:Date.now()};
      await setDoc(doc(db,"students",cr.user.uid),data);
      saveId(num);
      me=data;view="wait";watchStudent(cr.user.uid);render();
    }
    else if(a==="login"){
      if(isLocked()){setNote("تم إيقاف المحاولات مؤقتاً بسبب تكرار الخطأ، انتظر قليلاً.");return render()}
      const n=f1.value.trim(),pw=f2.value.trim();
      if(!n||!pw){setNote("أدخل الرقم الجامعي أو اسم المسؤول وكلمة السر.");return render()}
      let loggedIn=false;
      if(/^[A-Za-z0-9_.-]+$/.test(n) && pw.length>=6){
        try{
          const cr=await signInWithEmailAndPassword(auth,n+STUDENT_DOMAIN,pw);
          const snap=await getDoc(doc(db,"students",cr.user.uid));
          if(snap.exists()){
            const s=snap.data();
            const now=Date.now();
            await updateDoc(doc(db,"students",cr.user.uid),{lastLoginAt:now}).catch(()=>{});
            saveId(n);
            failCount=0;
            me={...s,lastLoginAt:now};
            if(s.status==="approved"){
              if(s.acceptedRules){view="choose"}
              else{view="welcome"}
            }else{view="wait";watchStudent(cr.user.uid)}
            loggedIn=true;
            return render();
          }
          await signOut(auth);
        }catch(_e){}
      }
      if(!loggedIn){
        try{
          await adminLogin(n.toLowerCase(),pw);
          failCount=0;
        }catch(e){
          failCount++;
          if(failCount>=4){lockUntil=Date.now()+20000;setNote("محاولات خاطئة متكررة. تم تفعيل مؤقت تهدئة لمدة 20 ثانية.");}
          else{setNote(friendlyAuthError(e));}
          render();
        }
      }
    }
    else if(a==="addpost"){
      const body=document.getElementById("pBody").value.trim();
      let targetGId = selectedGroupId;
      if(selectedGroupId === "all"){
        const selEl = document.getElementById("pGroupSelect");
        targetGId = selEl ? selEl.value : "general";
      }
      if(!body){setNote("اكتب نص المنشور قبل النشر.");return render()}
      const grpObj = groups.find(g => g.id === targetGId);
      const gName = grpObj ? grpObj.name : "القروب العام";

      await addDoc(collection(db,"group_posts"),{
        groupId: targetGId,
        groupName: gName,
        authorUid: me.uid,
        authorName: me.name,
        authorNum: me.num,
        body,
        at: Date.now()
      });
      setNote("تم النشر في القروب بنجاح!","good");render();
    }
    else if(a==="delpost"){
      await deleteDoc(doc(db,"group_posts",el.dataset.id));
      setNote("تم حذف المنشور.","good");render();
    }
    else if(a==="addreply"){
      const postId=el.dataset.postid;
      const inp=document.getElementById("rep_"+postId);
      const body=inp?inp.value.trim():"";
      if(!body){setNote("اكتب نص الرد أولاً.");return render()}
      await addDoc(collection(db,"group_replies"),{
        postId,
        authorUid:me.uid,
        authorName:me.name,
        body,
        at:Date.now()
      });
      setNote("تم إضافة ردك.","good");render();
    }
    else if(a==="delreply"){
      await deleteDoc(doc(db,"group_replies",el.dataset.id));
      setNote("تم حذف الرد.","good");render();
    }
    else if(a==="addgrp"){
      const name=document.getElementById("gName").value.trim(),desc=document.getElementById("gDesc").value.trim();
      if(!name){setNote("أدخل اسم القروب.");return render()}
      await addDoc(collection(db,"groups"),{name,desc,at:Date.now()});
      setNote("تم إنشاء القروب بنجاح.","good");render();
    }
    else if(a==="delgrp"){
      if(confirm("حذف هذا القروب نهائياً؟")) await deleteDoc(doc(db,"groups",el.dataset.id));
    }
    else if(a==="sendmsg"){
      const title=document.getElementById("mTitle").value.trim(),body=document.getElementById("mBody").value.trim();
      if(!title||!body){setNote("اكتب الموضوع ونص الرسالة.");return render()}
      await addDoc(collection(db,"messages"),{uid:me.uid,senderName:me.name,senderNum:me.num,title,body,at:Date.now()});
      setNote("تم إرسال رسالتك إلى المسؤول بنجاح.","good");render();
    }
    else if(a==="addann"){
      const title=document.getElementById("aTitle").value.trim(),body=document.getElementById("aBody").value.trim();
      if(!title||!body){setNote("أدخل عنوان الإعلان ونصه.");return render()}
      await addDoc(collection(db,"announcements"),{title,body,at:Date.now()});
      setNote("تم نشر الإعلان.","good");render();
    }
    else if(a==="delann"){await deleteDoc(doc(db,"announcements",el.dataset.id))}
    else if(a==="addres"){
      const title=document.getElementById("rTitle").value.trim(),level=document.getElementById("rLevel").value,url=document.getElementById("rUrl").value.trim(),desc=document.getElementById("rDesc").value.trim();
      if(!title){setNote("أدخل اسم المادة أو الملخص.");return render()}
      await addDoc(collection(db,"resources"),{title,level,url,desc,at:Date.now()});
      setNote("تمت إضافة المصدر.","good");render();
    }
    else if(a==="delres"){await deleteDoc(doc(db,"resources",el.dataset.id))}
    else if(a==="delmsg"){await deleteDoc(doc(db,"messages",el.dataset.id))}
    else if(a==="approve"){
      const targetId=el.dataset.id;
      const studentRef=doc(db,"students",targetId);
      const cfgRef=doc(db,"config","main");
      await runTransaction(db,async tx=>{
        const [stSnap,cfgSnap]=await Promise.all([tx.get(studentRef),tx.get(cfgRef)]);
        if(!stSnap.exists())throw new Error("الطالب غير موجود.");
        const cap=cfgSnap.exists()&&Number(cfgSnap.data().capacity)>0?Number(cfgSnap.data().capacity):cfg.capacity;
        const currentApproved=count("approved")+(stSnap.data().status==="approved"?-1:0);
        if(stSnap.data().status!=="approved"&&currentApproved>=cap){
          throw new Error(`وصلت للحد الأقصى (${cap}). ارفع العدد الأقصى أولاً.`);
        }
        tx.update(studentRef,{status:"approved"});
      });
    }
    else if(a==="reject"){await updateDoc(doc(db,"students",el.dataset.id),{status:"rejected"})}
    else if(a==="del"){if(confirm("حذف هذا الطلب نهائياً؟"))await deleteDoc(doc(db,"students",el.dataset.id))}
    else if(a==="delall"){const list=students.filter(x=>x.status==="rejected");if(confirm("حذف كل المرفوضين ("+list.length+") نهائياً؟")){for(const x of list)await deleteDoc(doc(db,"students",x.id));setNote("تم حذف المرفوضين","good");render()}}
    else if(a==="cap"){
      const v=parseInt(document.getElementById("cap").value,10);
      if(!(v>=1)){setNote("أدخل رقماً صحيحاً.");return render()}
      await setDoc(doc(db,"config","main"),{capacity:v});setNote("تم تحديث العدد الأقصى إلى "+v,"good");render();
    }
    else if(a==="addadmin"){
      if(!me.main)return;
      const u=document.getElementById("an").value.trim().toLowerCase(),p=document.getElementById("ap").value.trim();
      if(!/^[a-z0-9_.-]+$/.test(u)||p.length<6){setNote("اسم بحروف إنجليزية/أرقام، وكلمة سر 6 أحرف على الأقل.");return render()}
      if(u===MAIN_USER){setNote("هذا الاسم محجوز.");return render()}
      const second=initializeApp(firebaseConfig,"second"+Date.now());
      const a2=getAuth(second);
      const cr=await createUserWithEmailAndPassword(a2,u+ADMIN_DOMAIN,p);
      await signOut(a2);
      await setDoc(doc(db,"admins",cr.user.uid),{u,uid:cr.user.uid});
      setNote("تمت إضافة المسؤول "+u,"good");render();
    }
  }catch(e){setNote("حدث خطأ: "+friendlyAuthError(e));render()}
  finally{busy=false}
});
render();

    const el=document.getElementById("typed");if(!el)return;

    if(!del){ci++;if(ci>=p.length){ci=p.length;del=true;hold=22}}
    else if(hold>0){hold--}
    else{ci--;if(ci<=0){ci=0;del=false;pi=(pi+1)%ph.length}}
    el.textContent=p.slice(0,ci);
  },90);
})();
