<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة طلاب علوم الحاسوب — كلية الإمام الهادي</title>
<style>
:root{
  box-sizing:border-box;
  color-scheme:light;
  --page:#e9eff8;
  --surface:#ffffff;
  --soft:#f5f8fc;
  --ink:#0f234a;
  --muted:#526994;
  --line:#dce4f2;
  --blue:#1877f2;
  --blue-dark:#125ec4;
  --blue-soft:#e7f1ff;
  --ok:#146c43;
  --ok-bg:#e9f7ef;
  --no:#b3261e;
  --no-bg:#fdecec;
  --wr:#7a4f00;
  --wr-bg:#fff6e0;
  --shadow:0 2px 10px rgba(15,35,74,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--page);
  color:var(--ink);
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  line-height:1.55;
  overflow-x:hidden;
}

.topnav{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 8px rgba(15,35,74,.05);
}
.topnav-in{
  max-width:1280px;
  margin:0 auto;
  padding:8px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-badge{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--surface);
  border:2px solid var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
.logo-badge img{width:100%;height:100%;object-fit:contain;padding:2px}
.brand-title{
  font-weight:700;
  font-size:.98rem;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-sub{font-size:.75rem;color:var(--muted)}
.search-wrap{flex:1;max-width:360px}
.search-wrap input{
  width:100%;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  border-radius:999px;
  padding:8px 14px;
  font:inherit;
  font-size:.88rem;
}
.search-wrap input:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.top-actions{display:flex;align-items:center;gap:8px}

.auth-wrap{max-width:460px;margin:28px auto;padding:0 14px 40px}
.dash-wrap{max-width:1280px;margin:16px auto;padding:0 14px 44px}

.home-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:16px;
  align-items:start;
}
.left-rail{order:2}
.main-feed{order:1}
@media (max-width:920px){
  .home-layout{grid-template-columns:1fr}
  .left-rail{order:1}
  .main-feed{order:2}
}
@media (max-width:760px){.search-wrap{display:none}}

.admin-layout{
  display:grid;
  grid-template-columns:270px minmax(0,1fr) 290px;
  gap:16px;
  align-items:start;
}
@media (max-width:1024px){.admin-layout{grid-template-columns:1fr}}

.box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.hero-auth{text-align:center;margin-bottom:16px}
.hero-auth .big-logo{
  width:84px;
  height:84px;
  margin:0 auto 8px;
  border-radius:50%;
  background:var(--surface);
  border:2px solid var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.hero-auth .big-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
h1{margin:0;font-size:1.3rem;color:var(--ink)}
h2{margin:0 0 10px;font-size:1.05rem;color:var(--ink)}
h2.center{text-align:center;font-size:1.2rem;margin-bottom:8px}
.muted{color:var(--muted);font-size:.88rem;margin:4px 0 10px}
.code-line{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  color:var(--blue);
  font-size:.85rem;
  min-height:1.4em;
}
.caret{
  display:inline-block;
  width:7px;
  height:1em;
  background:var(--blue);
  margin-inline-start:2px;
  vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}

label{display:block;font-size:.84rem;color:var(--muted);margin:12px 0 4px;font-weight:600}
input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  border-radius:10px;
  padding:9px 11px;
  font:inherit;
  font-size:.92rem;
}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-inline-end:38px}
.eye-btn{position:absolute;inset-inline-end:6px;background:transparent;border:0;cursor:pointer;font-size:1rem;padding:4px}
.btn{
  border:0;
  border-radius:10px;
  padding:9px 14px;
  font:inherit;
  font-weight:700;
  font-size:.9rem;
  cursor:pointer;
  background:var(--blue);
  color:#fff;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover:not(:disabled){background:var(--blue-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%;margin-top:14px}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:var(--no);color:#fff}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
}
.avatar-circle{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--blue-soft);
  color:var(--blue);
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.rail-sec-title{
  font-size:.74rem;
  font-weight:800;
  letter-spacing:.4px;
  color:var(--muted);
  margin:12px 0 6px;
  text-transform:uppercase;
}
.rail-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px;
  border-radius:10px;
  color:var(--ink);
  text-decoration:none;
  font-size:.88rem;
  font-weight:600;
  margin-bottom:4px;
  background:transparent;
  cursor:pointer;
}
.rail-item:hover, .rail-item.active{background:var(--blue-soft);color:var(--blue)}
.see-more-btn{
  width:100%;
  margin-top:6px;
  padding:7px 10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  font:inherit;
  font-size:.84rem;
  font-weight:700;
  cursor:pointer;
}
.see-more-btn:hover{background:var(--blue-soft);color:var(--blue)}
.pill{
  background:var(--blue-soft);
  color:var(--blue);
  font-size:.74rem;
  padding:2px 8px;
  border-radius:999px;
  font-weight:700;
}

.feed-card{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
.feed-card:last-child{margin-bottom:0}
.feed-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
}
.feed-title{font-weight:700;color:var(--ink)}
.feed-meta{font-size:.78rem;color:var(--muted)}

.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:10px;
}
.mini-stat{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px;
  text-align:center;
}
.mini-stat b{display:block;font-size:1.15rem;color:var(--blue)}
.mini-stat span{font-size:.75rem;color:var(--muted)}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-top:1px solid var(--line);
  flex-wrap:wrap;
}
.row:first-child{border-top:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:6px 11px;font-size:.84rem}
.inl{display:flex;gap:8px;align-items:end}
.inl>div{flex:1}
.empty{text-align:center;color:var(--muted);padding:12px;font-size:.88rem}

.note{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:.88rem;font-weight:600}
.note.err{background:var(--no-bg);color:var(--no)}
.note.good{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--wr-bg);color:var(--wr)}
ul.warn{margin:6px 0 0;padding-inline-start:20px;font-weight:400}
.swt{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.swt a{color:var(--blue);font-weight:700;cursor:pointer}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPyYR--LMGnRWDk5ZfTv81pDqYgPVQnUw",
  authDomain: "mywep-65144.firebaseapp.com",
  projectId: "mywep-65144",
  storageBucket: "mywep-65144.firebasestorage.app",
  messagingSenderId: "534570832709",
  appId: "1:534570832709:web:90784f0c546d2a1f6de42c"
};

const MAIN_USER = "abdo";
const ADMIN_DOMAIN = "@platform.local";
const STUDENT_DOMAIN = "@students.platform.local";
const LAST_ID_KEY = "cs_platform_last_id";
const LOGO_SRC = "./logo.png";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp), db = getFirestore(fbApp);

let students=[],admins=[],announcements=[],resources=[],messages=[],groups=[],groupPosts=[],cfg={capacity:15},me=null,view="auth",tab="login",note=null,unsubs=[],busy=false,searchQ="";
let selectedGroupId="all";
let showAllRes=false,showAllAnn=false,showAllGrp=false;
let failCount=0,lockUntil=0;
const app=document.getElementById("app");
const esc=s=>{const d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML};
const fmtDate=t=>t?new Date(t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"}):"";
const setNote=(t,k)=>{note=t?{t,k:k||"err"}:null};
const noteHtml=()=>note?`<div class="note ${note.k}">${esc(note.t)}</div>`:"";
const count=st=>students.filter(s=>s.status===st).length;
const clearSubs=()=>{unsubs.forEach(u=>u());unsubs=[]};
const savedId=()=>{try{return localStorage.getItem(LAST_ID_KEY)||""}catch(_e){return ""}};
const saveId=v=>{try{if(v)localStorage.setItem(LAST_ID_KEY,v);else localStorage.removeItem(LAST_ID_KEY)}catch(_e){}};
const pwField=(id,label,ph="")=>`<label>${label}</label><div class="pw-wrap"><input id="${id}" type="password" placeholder="${esc(ph)}" autocomplete="off"><button type="button" class="eye-btn" data-eye="${id}" aria-label="إظهار كلمة السر">👁️</button></div>`;
const isLocked=()=>Date.now()<lockUntil;
const logoImg=(alt="شعار كلية الإمام الهادي")=>`<img src="${LOGO_SRC}" alt="${esc(alt)}" onerror="this.outerHTML='<span>🎓</span>'">`;

setInterval(()=>{
  if(view==="auth" && tab==="login" && lockUntil>0){
    const btn=document.getElementById("loginBtn");
    const rem=Math.ceil((lockUntil-Date.now())/1000);
    if(rem>0 && btn){btn.disabled=true;btn.textContent=`انتظر ${rem} ثانية…`}
    else if(rem<=0){lockUntil=0;failCount=0;if(btn){btn.disabled=false;btn.textContent="دخول"}}
  }
},1000);

function friendlyAuthError(e){
  const c=e?.code||"";
  if(c==="auth/invalid-credential"||c==="auth/user-not-found"||c==="auth/wrong-password")return "الرقم الجامعي أو اسم المسؤول أو كلمة السر غير صحيحة.";
  if(c==="auth/email-already-in-use")return "هذا الرقم الجامعي مسجل مسبقاً، جرّب تسجيل الدخول.";
  if(c==="auth/weak-password")return "كلمة السر ضعيفة، يجب أن تكون 6 أحرف على الأقل.";
  if(c==="auth/network-request-failed")return "تعذّر الاتصال بالإنترنت، تحقّق من شبكتك.";
  if(c==="auth/too-many-requests")return "تم إرسال طلبات كثيرة مؤقتاً، انتظر قليلاً ثم أعد المحاولة.";
  return e?.message||c||"حدث خطأ غير متوقع.";
}

function render(){
  const isWide = (view==="home"||view==="admin");
  app.className = isWide ? "dash-wrap" : "auth-wrap";
  ({auth:rAuth,welcome:rWelcome,admin:rAdmin,home:rHome,wait:rWait})[view]();
}

function authHero(){
  return `<div class="hero-auth">
    <div class="big-logo">${logoImg()}</div>
    <h1>منصة طلاب علوم الحاسوب</h1>
    <div class="code-line" dir="ltr"><span id="typed"></span><i class="caret"></i></div>
    <p class="muted">كلية الإمام الهادي — مساحة لزملاء التخصص</p>
  </div>`;
}

function topNav(title){
  return `<header class="topnav">
    <div class="topnav-in">
      <div class="brand">
        <div class="logo-badge">${logoImg()}</div>
        <div>
          <div class="brand-title">${esc(title)}</div>
          <div class="brand-sub">كلية الإمام الهادي • علوم الحاسوب</div>
        </div>
      </div>
      <div class="search-wrap">
        <input id="qInput" value="${esc(searchQ)}" placeholder="بحث في المنشورات والمصادر…">
      </div>
      <div class="top-actions">
        <button class="btn ghost" data-act="out">خروج</button>
      </div>
    </div>
  </header>`;
}

function rAuth(){
  const login=tab==="login";
  const last=savedId();
  const rem=Math.ceil((lockUntil-Date.now())/1000);
  app.innerHTML=authHero()+`<div class="box"><h2 class="center">${login?"تسجيل الدخول":"إنشاء حساب جديد"}</h2>`
  +(login
   ?`<label>الرقم الجامعي أو اسم المسؤول</label><input id="f1" value="${esc(last)}" autocomplete="off">`
     +pwField("f2","كلمة السر")
     +`<button id="loginBtn" class="btn full" data-act="login" ${rem>0?"disabled":""}>${rem>0?`انتظر ${rem} ثانية…`:"دخول"}</button>
      <div class="swt"><span>ليس لديك حساب؟</span><a data-act="tab" data-v="reg">إنشاء حساب</a>${last?`<a data-act="clearid">مسح الرقم المحفوظ</a>`:""}</div>`
   :`<label>الاسم الكامل</label><input id="f1" autocomplete="off">
     <label>الرقم الجامعي</label><input id="f2" inputmode="numeric" autocomplete="off">
     <label>المستوى الدراسي</label><select id="f3"><option value="المستوى الأول">المستوى الأول</option><option value="المستوى الثاني">المستوى الثاني</option><option value="المستوى الثالث">المستوى الثالث</option><option value="المستوى الرابع">المستوى الرابع</option></select>`
     +pwField("f4","كلمة السر (6 أحرف على الأقل)")
     +pwField("f5","تأكيد كلمة السر")
     +`<button class="btn full" data-act="reg">إرسال طلب الانضمام</button>
      <div class="swt"><span>لديك حساب؟</span><a data-act="tab" data-v="login">تسجيل الدخول</a></div>
      <p class="muted" style="margin:10px 0 0">سيصل طلبك إلى المسؤول وتدخل بعد موافقته.</p>`)
  +noteHtml()+"</div>";
}

function rWait(){
  const st=me.status;
  const m=st==="approved"?["تمت الموافقة على طلبك! سجّل الدخول الآن.","good"]:st==="rejected"?["تم رفض أو إيقاف حسابك من المسؤول. يمكنك التواصل عبر الإدارة.","err"]:["تم إرسال طلبك إلى المسؤول، بانتظار الموافقة…","warn"];
  app.innerHTML=authHero()+`<div class="box"><h2>مرحباً ${esc(me.name)}</h2><div class="note ${m[1]}" style="margin-top:0">${m[0]}</div><button class="btn ghost full" data-act="out">العودة لتسجيل الدخول</button></div>`;
}

function rWelcome(){
  app.innerHTML=authHero()+`<div class="box"><div class="note good" style="margin-top:0"><b>✅ تمت الموافقة على دخولك</b><br>أهلاً بك ${esc(me.name)} في منصة طلاب علوم الحاسوب.</div>
  <div class="note warn"><b>⚠️ تحذير بشأن السلوك</b><ul class="warn"><li>احترم زملاءك وأساتذتك في كل ما تنشره.</li><li>يُمنع التنمر أو الإساءة أو الألفاظ الجارحة.</li><li>يُمنع الغش أو تبادل الحلول في الاختبارات والتقييمات.</li><li>يحق للمسؤول إيقاف أي حساب يخالف هذه القواعد.</li></ul></div>
  <button class="btn full" data-act="agree">أوافق وأتعهد بالالتزام</button><button class="btn ghost full" data-act="out">خروج</button></div>`;
}

function rHome(){
  const q=searchQ.trim().toLowerCase();
  
  // تصفية منشورات القروبات
  let filteredPosts = selectedGroupId === "all" ? groupPosts : groupPosts.filter(p => p.groupId === selectedGroupId);
  if(q) filteredPosts = filteredPosts.filter(p => `${p.authorName||""} ${p.body||""} ${p.groupName||""}`.toLowerCase().includes(q));

  const visRes=showAllRes?resources:resources.slice(0,2);
  const visAnn=showAllAnn?announcements:announcements.slice(0,2);
  const visGrp=showAllGrp?groups:groups.slice(0,3);
  const initial=(me.name||"ط").trim().charAt(0).toUpperCase();

  const postsHtml = filteredPosts.length
    ? filteredPosts.map(p => `<div class="feed-card">
        <div class="feed-head">
          <div>
            <span class="feed-title">${esc(p.authorName)}</span>
            <span class="pill" style="margin-inline-start:6px">${esc(p.groupName||"قروب عام")}</span>
          </div>
          <span class="feed-meta">${fmtDate(p.at)}</span>
        </div>
        <div class="muted" style="margin:8px 0;white-space:pre-line">${esc(p.body)}</div>
        ${p.authorUid === me.uid ? `<div class="acts"><button class="btn no" style="padding:4px 8px;font-size:.76rem" data-act="delpost" data-id="${esc(p.id)}">حذف منشورك</button></div>` : ""}
      </div>`).join("")
    : '<div class="empty">لا توجد منشورات في هذا القروب حالياً. كن أول من ينشر!</div>';

  const annCards=announcements.length
    ?announcements.map(a=>`<div class="feed-card"><div class="feed-head"><span class="feed-title">${esc(a.title)}</span><span class="feed-meta">${fmtDate(a.at)}</span></div><div class="muted" style="margin:0">${esc(a.body)}</div></div>`).join("")
    :'<div class="empty">لا توجد إعلانات حالياً.</div>';

  const resCards=resources.length
    ?resources.map(r=>`<div class="feed-card"><div class="feed-head"><span class="feed-title">${esc(r.title)}</span><span class="pill">${esc(r.level||"عام")}</span></div><div class="muted" style="margin:0 0 8px">${esc(r.desc||"")}</div>${r.url?`<a class="btn soft" href="${esc(r.url)}" target="_blank" rel="noopener">فتح المصدر</a>`:""}</div>`).join("")
    :'<div class="empty">لا توجد مصادر مضافة بعد.</div>';

  const leftSideHtml=`<aside class="left-rail">
    <div class="box">
      <div class="profile-mini">
        <div class="avatar-circle">${esc(initial)}</div>
        <div>
          <div style="font-weight:700">${esc(me.name)}</div>
          <div class="feed-meta">${esc(me.num)} • ${esc(me.level||"طالب")}</div>
        </div>
      </div>

      <div class="rail-sec-title">👥 القروبات والمجتمعات</div>
      <a class="rail-item ${selectedGroupId==="all"?"active":""}" data-act="selectgrp" data-id="all">
        <span>🌐 منشورات كل القروبات</span>
      </a>
      ${visGrp.map(g => `<a class="rail-item ${selectedGroupId===g.id?"active":""}" data-act="selectgrp" data-id="${esc(g.id)}">
        <span>📌 ${esc(g.name)}</span>
      </a>`).join("")}
      ${groups.length>3?`<button class="see-more-btn" data-act="toggrp">${showAllGrp?"عرض أقل ^":"عرض المزيد v"}</button>`:""}

function startStudentSubs(){
  clearSubs();
  unsubs.push(onSnapshot(collection(db,"announcements"),s=>{announcements=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"resources"),s=>{resources=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"groups"),s=>{groups=s.docs.map(d=>({...d.data(),id:d.id}));if(view==="home")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"group_posts"),s=>{groupPosts=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="home")render()},()=>{}));
}

function startAdminSubs(){
  clearSubs();
  const err=e=>{setNote("خطأ في القراءة: "+e.code);render()};
  unsubs.push(onSnapshot(collection(db,"students"),s=>{students=s.docs.map(d=>({...d.data(),id:d.id}));if(view==="admin")render()},err));
  unsubs.push(onSnapshot(doc(db,"config","main"),s=>{if(s.exists()&&s.data().capacity)cfg=s.data();if(view==="admin")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"admins"),s=>{admins=s.docs.map(d=>d.data());if(view==="admin")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"announcements"),s=>{announcements=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="admin")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"resources"),s=>{resources=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="admin")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"messages"),s=>{messages=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||0)-(a.at||0));if(view==="admin")render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"groups"),s=>{groups=s.docs.map(d=>({...d.data(),id:d.id}));if(view==="admin")render()},()=>{}));
}

function watchStudent(uid){
  clearSubs();
  unsubs.push(onSnapshot(doc(db,"students",uid),s=>{if(s.exists()){me={...me,...s.data()};if(view==="wait")rWait()}},()=>{}));
}

async function adminLogin(user,pw){
  const cr=await signInWithEmailAndPassword(auth,user+ADMIN_DOMAIN,pw);
  const main=user===MAIN_USER;
  if(!main){try{const d=await getDoc(doc(db,"admins",cr.user.uid));if(!d.exists())throw 0}catch(e){await signOut(auth);throw new Error("not-admin")}}
  me={name:user,main};view="admin";startAdminSubs();render();
}

app.addEventListener("input",ev=>{

  }
});

app.addEventListener("click",async ev=>{
  const eye=ev.target.closest("[data-eye]");
  if(eye){
    const inp=document.getElementById(eye.dataset.eye);
    if(inp){inp.type=inp.type==="password"?"text":"password";eye.textContent=inp.type==="password"?"👁️":"🙈"}
    return;
  }
  const el=ev.target.closest("[data-act]");if(!el||busy)return;
  const a=el.dataset.act,f1=document.getElementById("f1"),f2=document.getElementById("f2"),f3=document.getElementById("f3"),f4=document.getElementById("f4"),f5=document.getElementById("f5");
  setNote(null);busy=true;
  try{
    if(a==="selectgrp"){selectedGroupId=el.dataset.id;render()}
    else if(a==="togres"){showAllRes=!showAllRes;render()}
    else if(a==="togann"){showAllAnn=!showAllAnn;render()}
    else if(a==="toggrp"){showAllGrp=!showAllGrp;render()}
    else if(a==="tab"){tab=el.dataset.v;render()}
    else if(a==="clearid"){saveId("");render()}
    else if(a==="out"){clearSubs();await signOut(auth);me=null;view="auth";tab="login";render()}
    else if(a==="agree"){
      if(me?.uid){
        await updateDoc(doc(db,"students",me.uid),{acceptedRules:true,acceptedAt:Date.now()});
        me.acceptedRules=true;
      }
      view="home";startStudentSubs();render();
    }
    else if(a==="reg"){
      const n=f1.value.trim(),num=f2.value.trim(),lvl=f3.value,pw=f4.value.trim(),pw2=f5.value.trim();
      if(!n||!num||!pw||!pw2){setNote("أدخل الاسم والرقم الجامعي وكلمة السر وتأكيدها.");return render()}
      if(!/^[A-Za-z0-9_.-]+$/.test(num)){setNote("الرقم يجب أن يحتوي أرقاماً أو حروفاً إنجليزية فقط.");return render()}
      if(pw.length<6){setNote("كلمة السر يجب أن تكون 6 أحرف على الأقل.");return render()}
      if(pw!==pw2){setNote("كلمتا السر غير متطابقتين.");return render()}
      const cr=await createUserWithEmailAndPassword(auth,num+STUDENT_DOMAIN,pw);
      const data={uid:cr.user.uid,name:n,num,level:lvl,status:"pending",acceptedRules:false,at:Date.now()};
      await setDoc(doc(db,"students",cr.user.uid),data);
      saveId(num);
      me=data;view="wait";watchStudent(cr.user.uid);render();
    }
    else if(a==="login"){
      if(isLocked()){setNote("تم إيقاف المحاولات مؤقتاً بسبب تكرار الخطأ، انتظر قليلاً.");return render()}
      const n=f1.value.trim(),pw=f2.value.trim();
      if(!n||!pw){setNote("أدخل الرقم الجامعي أو اسم المسؤول وكلمة السر.");return render()}
      let loggedIn=false;
      if(/^[A-Za-z0-9_.-]+$/.test(n) && pw.length>=6){
        try{
          const cr=await signInWithEmailAndPassword(auth,n+STUDENT_DOMAIN,pw);
          const snap=await getDoc(doc(db,"students",cr.user.uid));
          if(snap.exists()){
            const s=snap.data();
            const now=Date.now();
            await updateDoc(doc(db,"students",cr.user.uid),{lastLoginAt:now}).catch(()=>{});
            saveId(n);
            failCount=0;
            me={...s,lastLoginAt:now};
            if(s.status==="approved"){
              if(s.acceptedRules){view="home";startStudentSubs()}
              else{view="welcome"}
            }else{view="wait";watchStudent(cr.user.uid)}
            loggedIn=true;
            return render();
          }
          await signOut(auth);
        }catch(_e){}
      }
      if(!loggedIn){
        try{
          await adminLogin(n.toLowerCase(),pw);
          failCount=0;
        }catch(e){
          failCount++;
          if(failCount>=4){lockUntil=Date.now()+20000;setNote("محاولات خاطئة متكررة. تم تفعيل مؤقت تهدئة لمدة 20 ثانية.");}
          else{setNote(friendlyAuthError(e));}
          render();
        }
      }
    }
    else if(a==="addpost"){
      const body=document.getElementById("pBody").value.trim();
      let targetGId = selectedGroupId;
      if(selectedGroupId === "all"){
        const selEl = document.getElementById("pGroupSelect");
        targetGId = selEl ? selEl.value : "general";
      }
      if(!body){setNote("اكتب نص المنشور قبل النشر.");return render()}
      const grpObj = groups.find(g => g.id === targetGId);
      const gName = grpObj ? grpObj.name : "القروب العام";
      
      await addDoc(collection(db,"group_posts"),{
        groupId: targetGId,
        groupName: gName,
        authorUid: me.uid,
        authorName: me.name,
        authorNum: me.num,
        body,
        at: Date.now()
      });
      setNote("تم النشر في القروب بنجاح!","good");render();
    }
    else if(a==="delpost"){
      await deleteDoc(doc(db,"group_posts",el.dataset.id));
      setNote("تم حذف المنشور.","good");render();
    }
    else if(a==="addgrp"){
      const name=document.getElementById("gName").value.trim(),desc=document.getElementById("gDesc").value.trim();
      if(!name){setNote("أدخل اسم القروب.");return render()}
      await addDoc(collection(db,"groups"),{name,desc,at:Date.now()});
      setNote("تم إنشاء القروب بنجاح.","good");render();
    }
    else if(a==="delgrp"){
      if(confirm("حذف هذا القروب نهائياً؟")) await deleteDoc(doc(db,"groups",el.dataset.id));
    }
    else if(a==="sendmsg"){
      const title=document.getElementById("mTitle").value.trim(),body=document.getElementById("mBody").value.trim();
      if(!title||!body){setNote("اكتب الموضوع ونص الرسالة.");return render()}
      await addDoc(collection(db,"messages"),{uid:me.uid,senderName:me.name,senderNum:me.num,title,body,at:Date.now()});
      setNote("تم إرسال رسالتك إلى المسؤول بنجاح.","good");render();
    }
    else if(a==="addann"){
      const title=document.getElementById("aTitle").value.trim(),body=document.getElementById("aBody").value.trim();
      if(!title||!body){setNote("أدخل عنوان الإعلان ونصه.");return render()}
      await addDoc(collection(db,"announcements"),{title,body,at:Date.now()});
      setNote("تم نشر الإعلان.","good");render();
    }
    else if(a==="delann"){await deleteDoc(doc(db,"announcements",el.dataset.id))}
    else if(a==="addres"){
      const title=document.getElementById("rTitle").value.trim(),level=document.getElementById("rLevel").value,url=document.getElementById("rUrl").value.trim(),desc=document.getElementById("rDesc").value.trim();
      if(!title){setNote("أدخل اسم المادة أو الملخص.");return render()}
      await addDoc(collection(db,"resources"),{title,level,url,desc,at:Date.now()});
      setNote("تمت إضافة المصدر.","good");render();
    }
    else if(a==="delres"){await deleteDoc(doc(db,"resources",el.dataset.id))}
    else if(a==="delmsg"){await deleteDoc(doc(db,"messages",el.dataset.id))}
    else if(a==="approve"){
      const targetId=el.dataset.id;
      const studentRef=doc(db,"students",targetId);
      const cfgRef=doc(db,"config","main");
      await runTransaction(db,async tx=>{
        const [stSnap,cfgSnap]=await Promise.all([tx.get(studentRef),tx.get(cfgRef)]);
        if(!stSnap.exists())throw new Error("الطالب غير موجود.");
        const cap=cfgSnap.exists()&&Number(cfgSnap.data().capacity)>0?Number(cfgSnap.data().capacity):cfg.capacity;
        const currentApproved=count("approved")+(stSnap.data().status==="approved"?-1:0);
        if(stSnap.data().status!=="approved"&&currentApproved>=cap){
          throw new Error(`وصلت للحد الأقصى (${cap}). ارفع العدد الأقصى أولاً.`);
        }
        tx.update(studentRef,{status:"approved"});
      });
    }
    else if(a==="reject"){await updateDoc(doc(db,"students",el.dataset.id),{status:"rejected"})}
    else if(a==="del"){if(confirm("حذف هذا الطلب نهائياً؟"))await deleteDoc(doc(db,"students",el.dataset.id))}
    else if(a==="delall"){const list=students.filter(x=>x.status==="rejected");if(confirm("حذف كل المرفوضين ("+list.length+") نهائياً؟")){for(const x of list)await deleteDoc(doc(db,"students",x.id));setNote("تم حذف المرفوضين","good");render()}}
    else if(a==="cap"){
      const v=parseInt(document.getElementById("cap").value,10);
      if(!(v>=1)){setNote("أدخل رقماً صحيحاً.");return render()}
      await setDoc(doc(db,"config","main"),{capacity:v});setNote("تم تحديث العدد الأقصى إلى "+v,"good");render();
    }
    else if(a==="addadmin"){
      if(!me.main)return;
      const u=document.getElementById("an").value.trim().toLowerCase(),p=document.getElementById("ap").value.trim();
      if(!/^[a-z0-9_.-]+$/.test(u)||p.length<6){setNote("اسم بحروف إنجليزية/أرقام، وكلمة سر 6 أحرف على الأقل.");return render()}
      if(u===MAIN_USER){setNote("هذا الاسم محجوز.");return render()}
      const second=initializeApp(firebaseConfig,"second"+Date.now());
      const a2=getAuth(second);
      const cr=await createUserWithEmailAndPassword(a2,u+ADMIN_DOMAIN,p);
      await signOut(a2);
      await setDoc(doc(db,"admins",cr.user.uid),{u,uid:cr.user.uid});
      setNote("تمت إضافة المسؤول "+u,"good");render();
    }
  }catch(e){setNote("حدث خطأ: "+friendlyAuthError(e));render()}
  finally{busy=false}
});
render();

(function(){
  const ph=['> while(alive){ learn(); }','> git commit -m "new idea"','> print("Hello, CS!")','> sudo make me_a_dev'];
  let pi=0,ci=0,del=false,hold=0;
  setInterval(()=>{
    const el=document.getElementById("typed");if(!el)return;
    const p=ph[pi];
    if(!del){ci++;if(ci>=p.length){ci=p.length;del=true;hold=22}}
    else if(hold>0){hold--}
    else{ci--;if(ci<=0){ci=0;del=false;pi=(pi+1)%ph.length}}
    el.textContent=p.slice(0,ci);
  },90);
})();
</script>
